[package]
name = "piweb-desktop"
version = "1.0.1"
description = "Pi Web 桌面客户端（pi coding agent 本地工作台）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "piweb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }

# Job Object：退出时整树终止 sidecar（防残留 node 锁 payload 文件，升级安装报写入失败）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
