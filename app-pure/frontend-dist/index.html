<!doctype html><html><head><meta charset="utf-8"><title>Pi Web</title>
<style>
  body { font: 14px/1.7 system-ui, "Segoe UI", sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; color: #1f2937; }
  .card { text-align: center; padding: 32px 40px; }
  .ring { width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%;
          border: 3px solid #d1d5db; border-top-color: #b8860b; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #msg { font-size: 15px; font-weight: 600; }
  #sub { margin-top: 8px; font-size: 12px; color: #6b7280; }
</style></head>
<body>
<div class="card">
  <div class="ring"></div>
  <div id="msg">正在启动 Pi Web…</div>
  <div id="sub">首次启动或安全软件扫描时可能需要数十秒，页面会自动进入工作台</div>
</div>
<script>
/* 自愈启动页：WebView 进程轮询 pi-web 就绪（no-cors 探测不受同源限制），
 * 通了即跳转。Rust 侧探测可能被安全软件拦截（新复制 exe 的回环连接），
 * 因此就绪判定以此页为准 —— 就绪后无论 Rust 探测结果如何都能进入工作台。 */
(function () {
  var url = "http://127.0.0.1:30141/";
  var msg = document.getElementById("msg");
  var sub = document.getElementById("sub");
  var t0 = Date.now();
  function note(t) { msg.textContent = t; }
  function poll() {
    var elapsed = (Date.now() - t0) / 1000;
    fetch(url, { mode: "no-cors", cache: "no-store" })
      .then(function () { location.replace(url); })
      .catch(function () {
        if (elapsed > 90) {
          note("启动耗时较长，仍在重试…");
          sub.textContent = "持续失败请查看安装目录 data/logs/（关掉本窗口稍后再试亦可）";
        } else if (elapsed > 20) {
          note("仍在启动…（安全软件可能在扫描文件）");
        }
        setTimeout(poll, 800);
      });
  }
  poll();
})();
</script>
</body></html>
