[package]
name = "gba-font-studio"
version = "1.0.8"
description = "GBA 字库工作台桌面客户端（内置模拟器与中文字库/翻译 Agent）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gba_font_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }

# Job Object：退出时整树终止 sidecar（防残留 node 锁 payload 文件，升级安装报写入失败）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
