[package]
name = "gba-font-studio"
version = "1.0.0"
description = "GBA 字库工作台桌面客户端（内置模拟器与中文字库/翻译 Agent）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gba_font_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
